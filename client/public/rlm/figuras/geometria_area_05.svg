<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img"><title>Área do triângulo com altura perpendicular</title><rect width="760" height="440" fill="#f6fbf9"/><rect x="16" y="16" width="728" height="408" rx="20" fill="white" stroke="#c1dcd3" stroke-width="2"/><text x="36" y="59" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#183b49">Área do triângulo com altura perpendicular</text><g font-family="Arial,sans-serif" font-size="19" fill="#183b49"><polygon points="140,354 627,354 338,101" fill="#c6e9e1" stroke="#168f91" stroke-width="4"/><path d="M338 101 V354" fill="none" stroke="#b48b2d" stroke-width="3" stroke-dasharray="9 7"/><text x="492" y="389" text-anchor="middle">Base = 12 m</text><text x="400" y="238" text-anchor="middle">Altura = 5 m</text><text x="381" y="416" text-anchor="middle">Área = 12 × 5 / 2 = 30 m²</text></g></svg>