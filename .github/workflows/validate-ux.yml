name: Validar experiência do aluno

on:
  push:
    branches:
      - feat/ux-acessibilidade-jornada-aluno
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Verificar TypeScript
        run: pnpm check
      - name: Executar testes
        run: pnpm test
      - name: Compilar aplicação
        run: pnpm build
