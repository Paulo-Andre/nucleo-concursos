name: Validate application
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm check
      - run: pnpm test:unit
      - run: pnpm build
  mysql-startup:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: nucleo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:ci-only-password@127.0.0.1:3306/nucleo_test
      ROOT_INITIAL_PASSWORD: ci-root-password-only
      NODE_ENV: test
      DATABASE_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --prod=false
      - name: Migrate an empty database
        run: pnpm db:migrate
      - name: Verify migrations can run again
        run: pnpm db:migrate
      - name: Verify transactional backup restoration
        run: pnpm exec tsx server/test/restoreBackupSmoke.ts
      - name: Create the initial account and seed content
        run: >-
          pnpm exec tsx -e 'import { ensureRootAccount } from "./server/auth/rootBootstrap";
          ensureRootAccount().then(() => process.exit(0)).catch(error => { console.error(error); process.exit(1); })'
      - name: Verify first login and logout
        env:
          DATABASE_URL: ''
          TEST_DATABASE_URL: mysql://root:ci-only-password@127.0.0.1:3306/nucleo_test
          ALLOW_TEST_DATABASE_WRITES: 'true'
        run: pnpm test:integration server/auth/local-login.integration.test.ts
