name: QA biblioteca ROOT — exclusões e Excel

on:
  pull_request:
    branches:
      - fix/qa-seguranca-aprendizagem-20261019
    paths:
      - server/**
      - client/src/components/**
      - drizzle/**
      - .github/workflows/qa-biblioteca-exclusao-importacao.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-and-delete:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: qa_root_password_only
          MYSQL_DATABASE: nucleo_qa
          MYSQL_USER: qa_user
          MYSQL_PASSWORD: qa_password_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u qa_user -pqa_password_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: mysql://qa_user:qa_password_only@127.0.0.1:3306/nucleo_qa
      JWT_SECRET: qa_jwt_secret_unique_for_ci_only_not_production_123
      ROOT_INITIAL_PASSWORD: qa_root_password_local_ci_only
      OWNER_OPEN_ID: ""
      RESEND_API_KEY: ""
      MERCADO_PAGO_ACCESS_TOKEN: "TEST-ci-only-fake-not-valid-for-api"
      MERCADO_PAGO_WEBHOOK_SECRET: "qa_webhook_signature_test_only_never_in_production"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Checar TypeScript
        run: pnpm check
      - name: Criar banco sintético do QA
        run: pnpm db:push
      - name: Criar dados QA isolados
        run: pnpm exec tsx scripts/seed-qa.ts
      - name: Testar atualização de conteúdos e exclusões individuais/em lote
        run: pnpm exec vitest run server/spreadsheetImport.integration.test.ts server/library-deletion.integration.test.ts server/discipline-content-clear.integration.test.ts server/discipline-question-clear.integration.test.ts server/question-deletion.integration.test.ts --maxWorkers=1 --minWorkers=1 --no-file-parallelism
      - name: Compilar para produção
        run: pnpm build
